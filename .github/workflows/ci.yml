name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Live data for the build and the Lighthouse run (repository secrets; the anon key is the
      # same public key the deployed app ships with).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Tokens-only CSS (stylelint, the library's rules)
        run: pnpm lint:css
      - name: Supabase secrets are set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - run: pnpm build
      - name: Newest ready digest (for the archive detail page)
        run: |
          id=$(curl -fsS "$VITE_SUPABASE_URL/rest/v1/digests?select=id&status=eq.ready&order=digest_date.desc&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" | jq -r '.[0].id // empty')
          echo "LH_DIGEST_ID=$id" >> "$GITHUB_ENV"
          echo "detail page: ${id:-none}"
      - name: Lighthouse accessibility = 100 and SEO = 100 (every route, mobile + desktop)
        run: pnpm lighthouse
      - name: Lighthouse scores
        if: always()
        run: |
          { echo '### Lighthouse'; node scripts/lighthouse-summary.mjs .lighthouseci/reports .lighthouseci/reports-desktop; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app
          path: |
            dist
            .lighthouseci
          if-no-files-found: ignore
          # .lighthouseci/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
