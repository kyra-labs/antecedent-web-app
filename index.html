<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Antecedent</title>
    <meta name="description" content="Today's tech news, with the history behind it." />
    <!-- Link previews and a site-name signal (static: the same on every route, so no og:url). -->
    <meta property="og:site_name" content="Antecedent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Antecedent" />
    <meta property="og:description" content="Today's tech news, with the history behind it." />
    <meta property="og:image" content="https://antecedent.kyralabs.dev/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <!-- Apply the saved theme (default dark, as before) before first paint. -->
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
    </script>
    <!-- Site name for Google Search (static, so it doesn't wait for the app's JavaScript). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://antecedent.kyralabs.dev/#website",
        "name": "Antecedent",
        "url": "https://antecedent.kyralabs.dev/",
        "inLanguage": "en",
        "publisher": {
          "@type": "Organization",
          "@id": "https://kyralabs.dev/#organization",
          "name": "Kyra Labs",
          "url": "https://kyralabs.dev/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
